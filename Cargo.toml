[package]
name = "scc"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Play SoundCloud in your terminal"
repository = "https://github.com/fentz26/scc"
readme = "README.md"
keywords = ["soundcloud", "music", "player", "cli", "tui"]
categories = ["command-line-utilities", "multimedia::audio"]
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"
ureq = "3.5.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
