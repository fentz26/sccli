name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv
      - name: Install mpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv
      - name: Install mpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mpvio --no-progress -y
          Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\lib\mpvio.install\tools'
      - run: cargo test --locked
      - name: Test against real mpv
        run: cargo test --locked -- --ignored
      - run: cargo build --release --locked
      - run: cargo run --release --locked -- --version

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm gcc git mpv rustup
      - uses: actions/checkout@v4
      - run: cargo test --locked
      - name: Test against real mpv
        run: cargo test --locked -- --ignored
      - run: cargo build --release --locked
