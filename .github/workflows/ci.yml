name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  rust:
    name: rust (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.85 is the declared minimum. 1.91 builds the Ubuntu 22.04, 24.04 and 26.04 packages,
        # 1.97 builds Ubuntu 26.10's.
        rust: ["1.85", "1.91", "1.97", stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mpv
      - name: Install mpv (macOS)
        if: runner.os == 'macOS'
        run: brew install mpv
      - name: Install mpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mpvio --no-progress -y
          Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\lib\mpvio.install\tools'
      - run: cargo test --locked
      - name: Test against real mpv
        run: cargo test --locked -- --ignored
      - run: cargo build --release --locked
      - run: cargo run --release --locked -- --version

  ubuntu-package:
    name: package (${{ matrix.series }})
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { series: jammy, image: "22.04" }
          - { series: noble, image: "24.04" }
          - { series: resolute, image: "26.04" }
          - { series: stonking, image: "26.10" }
    env:
      SERIES: ${{ matrix.series }}
    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates cargo debhelper dpkg-dev git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the source package
        run: |
          git config --global --add safe.directory "$PWD"
          packaging/ubuntu/source-package.sh "$SERIES"
      - name: Build the binary package as Launchpad would, without network access
        working-directory: build/ppa/${{ matrix.series }}
        run: |
          dpkg-source -x ./*.dsc source
          cd source
          apt-get build-dep -y ./
          dpkg-buildpackage -b -us -uc
      - name: Install it and run it
        working-directory: build/ppa/${{ matrix.series }}
        run: |
          apt-get install -y --no-install-recommends ./sccli_*.deb
          scc --version

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm gcc git mpv rust
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo test --locked
      - name: Test against real mpv
        run: cargo test --locked -- --ignored
      - run: cargo build --release --locked
